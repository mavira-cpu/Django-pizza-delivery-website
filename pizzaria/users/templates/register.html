{% extends 'base.html' %}

{% block title %}Register - Pizzon{% endblock %}

{% block content %}
<div class="container">
    <div class="auth-box">
        <h1>Create Account 🍕</h1>
        <p>Join Pizzon and enjoy faster ordering</p>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="id_username">Username *</label>
                <input type="text" name="username" id="id_username" required>
            </div>
            
            <div class="form-group">
                <label for="id_email">Email *</label>
                <input type="email" name="email" id="id_email" required>
            </div>
            
            <div class="form-group">
                <label for="id_password1">Password *</label>
                <input type="password" name="password1" id="id_password1" required>
                <small class="help-text">At least 8 characters</small>
            </div>
            
            <div class="form-group">
                <label for="id_password2">Confirm Password *</label>
                <input type="password" name="password2" id="id_password2" required>
            </div>
            
            <div class="form-group">
                <label for="id_phone">Phone Number</label>
                <input type="tel" name="phone" id="id_phone">
            </div>
            
            <div class="form-group">
                <label for="id_address">Address</label>
                <textarea name="address" id="id_address" rows="2"></textarea>
            </div>
            
            <button type="submit" class="btn-primary" style="width: 100%;">Register</button>
        </form>
        
        <p class="auth-link">
            Already have an account? <a href="{% url 'users:login' %}">Login</a>
        </p>
    </div>
</div>

<style>
    .auth-box {
        max-width: 500px;
        margin: 3rem auto;
        background: white;
        border-radius: 16px;
        padding: 2.5rem;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    
    .auth-box h1 {
        text-align: center;
        margin-bottom: 0.5rem;
    }
    
    .auth-box p {
        text-align: center;
        color: #666;
        margin-bottom: 2rem;
    }
    
    .form-group {
        margin-bottom: 1.5rem;
    }
    
    .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.5rem;
        color: #333;
    }
    
    .form-group input,
    .form-group textarea {
        width: 100%;
        padding: 0.8rem 1rem;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 1rem;
        transition: border-color 0.3s;
        font-family: inherit;
    }
    
    .form-group input:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: #F62440;
        box-shadow: 0 0 0 3px rgba(246, 36, 64, 0.1);
    }
    
    .help-text {
        display: block;
        color: #666;
        font-size: 0.85rem;
        margin-top: 0.25rem;
    }
    
    .btn-primary {
        display: inline-block;
        background: #F62440;
        color: white;
        padding: 14px 36px;
        border-radius: 50px;
        text-decoration: none;
        font-weight: bold;
        border: none;
        cursor: pointer;
        transition: background 0.3s;
        font-size: 1rem;
    }
    
    .btn-primary:hover {
        background: #d41a33;
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(246, 36, 64, 0.3);
    }
    
    .auth-link {
        text-align: center;
        margin-top: 1.5rem;
        padding-top: 1.5rem;
        border-top: 1px solid #eee;
    }
    
    .auth-link a {
        color: #F62440;
        text-decoration: none;
        font-weight: 600;
    }
    
    .auth-link a:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}
